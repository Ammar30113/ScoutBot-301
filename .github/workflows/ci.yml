name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip check

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Offline paper lifecycle smoke
        run: python -m scripts.paper_smoke

  paper-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t scout-paper .
      - name: Verify minimal runtime without credentials or network
        run: |
          docker run --rm --network none scout-paper python -m pip check
          docker run --rm --network none scout-paper python -c "import main"
          docker run --rm --network none scout-paper python -m scripts.paper_smoke
